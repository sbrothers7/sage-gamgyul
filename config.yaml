# =====================================================================
#  감귤 병해 영상분류 AI 일반화 성능 분석 — 실험 설정 파일
# =====================================================================
#  이 파일 하나만 고치면 모든 실험 조건이 바뀝니다.
#  코드는 건드리지 마세요.
# =====================================================================

# --- 재현성 -----------------------------------------------------------
# 같은 seed면 몇 번을 돌려도 같은 결과가 나옵니다.
# 논문에 "seed=42로 고정했다"고 쓸 수 있어야 합니다.
seed: 42

# --- 분류할 병해 목록 -------------------------------------------------
# 폴더 이름과 정확히 일치해야 합니다. (대소문자 구분)
# 재현 대상 논문(Devora-Guadarrama et al., 2025)은 아래 3종을 사용했습니다.
classes:
  - healthy       # 건전
  - canker        # 궤양병
  - greening      # 황룡병 (HLB)

# --- 데이터 경로 ------------------------------------------------------
data:
  # A: 재현용 데이터 (원 논문이 쓴 공개 데이터셋)
  #    구조 → data/raw/source_A/<병해이름>/*.jpg
  source_A: data/raw/source_A
  source_A_label: "공개 데이터셋 (재현용)"

  # B: 일반화 검증용 데이터 (직접 수집한 새 감귤 이미지)
  #    구조 → data/raw/source_B/<병해이름>/*.jpg
  source_B: data/raw/source_B
  source_B_label: "신규 수집 감귤 이미지 (검증용)"

  # A를 학습/검증/시험으로 나누는 비율 (합이 1.0이어야 함)
  split:
    train: 0.7
    val: 0.15
    test: 0.15

  image_size: 224          # 입력 이미지 크기 (픽셀)
  min_images_per_class: 5  # 이보다 적으면 경고

# --- 모델 -------------------------------------------------------------
model:
  # 아래 중 하나를 고르세요. 원 논문의 최고 성능 모델은 efficientnet_b0 입니다.
  #   efficientnet_b0 / resnet50 / densenet121 / mobilenetv3_large_100
  name: efficientnet_b0
  pretrained: true         # ImageNet 사전학습 가중치 사용 (전이학습)
  dropout: 0.3

# --- 학습 -------------------------------------------------------------
train:
  epochs: 30
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.0001
  early_stop_patience: 7   # 검증 성능이 N번 연속 안 오르면 중단
  num_workers: 0           # Windows에서는 0을 권장 (0이 아니면 오류 날 수 있음)

  # 데이터 증강 (학습 시에만 적용)
  augment:
    horizontal_flip: true
    vertical_flip: false
    rotation_degrees: 20
    color_jitter: 0.2

# --- 실험 조건 --------------------------------------------------------
experiment:
  # 배경 제거 대조군을 함께 돌릴지 여부.
  # true로 두면 "모델이 병반을 본 것인가, 배경을 본 것인가"를 검증할 수 있습니다.
  # (Mahapatra et al., 2026 의 실험 설계를 따름)
  run_background_removed: true

# --- Grad-CAM ---------------------------------------------------------
gradcam:
  num_samples_per_class: 4   # 병해별로 몇 장씩 히트맵을 만들지
  overlay_alpha: 0.5         # 히트맵 투명도 (0~1)

# --- 출력 경로 (보통 안 건드려도 됨) ----------------------------------
output:
  root: results
